modLoader = "javafml"
loaderVersion = "[${loader_version},)"
license = "LGPL-2.1"

[[mods]]
modId = "ropebridge"
version = "${mod_version}"
displayName = "Rope Bridge"
updateJSONURL = "https://raw.githubusercontent.com/Cazsius/Rope-Bridge/dev/updates.json"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/rope-bridge"
logoFile = "ropebridge.logo.png"
credits = "Originally created by czechmate777. Art from wiresgal and TrisAstral"
authors = "MrTrollNugNug, Lewis_McReu, Darkhax, noobanidus, Jaredlll08, yrsegal, tfarcenim"
description = '''
A mod that adds rope bridges to Minecraft. Craft the grappling gun and shoot it over a gap large or small to build a rope bridge across it.
'''

# Dependencies are optional.
[[dependencies.ropebridge]]
modId = "forge"
mandatory = true
versionRange = "[${loader_version},)"
ordering = "NONE" # BEFORE or AFTER required if the relationship is not mandatory
side = "BOTH" # BOTH, CLIENT or SERVER
